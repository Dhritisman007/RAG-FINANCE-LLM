# Financial Knowledge RAG Agent — Corpus Manifest
# This is the single source of truth for what gets ingested.
# Day 2/3 scrapers read this file; they do not hardcode source lists themselves.

target_total_docs: 172  # soft target (tier1 47 + tier2 75 + tier2_india 15 + tier3 35)

tier1_fundamentals:
  description: >
    Plain-language financial concepts. Short, high-clarity documents.
    Used to answer "what is X" / "how do I calculate X" style queries.
  target_count: 47
  doc_type: "explainer"
  sources:
    - name: investopedia
      base_url: "https://www.investopedia.com"
      topics:
        - "equated monthly installment (EMI)"
        - "loan amortization"
        - "compound interest"
        - "simple interest"
        - "mutual funds basics"
        - "SIP (systematic investment plan)"
        - "bonds and yield"
        - "bond duration"
        - "stocks basics"
        - "options basics (calls/puts)"
        - "futures basics"
        - "derivatives overview"
        - "diversification"
        - "expense ratio"
        - "net asset value (NAV)"
        - "credit score basics"
        - "dollar-cost averaging"
        - "annual percentage rate (APR)"
        - "annual percentage yield (APY)"
        - "inflation"
        - "time value of money"
        - "present value"
        - "net present value (NPV)"
        - "dividends"
        - "price-to-earnings (P/E) ratio"
        - "market capitalization"
        - "index funds"
        - "exchange-traded funds (ETF)"
        - "asset allocation"
        - "risk tolerance"
        - "mortgage basics"
        - "call options"
        - "put options"
        - "yield to maturity"
        - "capital gains"
        - "return on investment (ROI)"
        - "volatility"
        - "compound annual growth rate (CAGR)"
        # Day 16: gaps the evaluation exposed
        - "credit spread"
        - "liquidity"
        - "arbitrage"
        - "Roth IRA"
        - "individual retirement account (IRA)"
        - "401(k) plan"
        - "market order"
        - "limit order"
        - "bid-ask spread"
      # scraper will search-and-fetch one canonical article per topic
    - name: rbi_investor_education
      base_url: "https://www.rbi.org.in"
      note: "RBI financial literacy / investor education PDFs (loans, interest, EMI)"
    - name: sebi_investor_education
      base_url: "https://investor.sebi.gov.in"
      note: "SEBI investor education booklets (mutual funds, bonds, derivatives basics)"
    - name: khan_academy_finance
      base_url: "https://www.khanacademy.org/economics-finance-domain"
      note: "core finance & capital markets unit — interest, bonds, stocks modules"

