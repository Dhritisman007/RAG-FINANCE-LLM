tier2_india:
  description: >
    Annual reports of large NSE-listed Indian companies (Day 18): the integrated
    report, Board's report, MD&A, corporate governance and the consolidated
    financial statements. Amounts are in ₹ (mostly ₹ crore).
  target_count: 15  # 15 companies x latest annual report
  doc_type: "annual_report"
  source:
    name: nse_annual_report
    listing_api: "https://www.nseindia.com/api/annual-reports?index=equities&symbol={symbol}"
  keep_sections: ["Integrated Report", "Board's Report", "Management Discussion and Analysis",
                  "Corporate Governance Report", "Consolidated Financial Statements"]
  skip_sections: ["Notice", "Business Responsibility and Sustainability Report", "Standalone Financial Statements"]
  companies: # NIFTY large caps across sectors; tickers use Yahoo's NSE suffix
