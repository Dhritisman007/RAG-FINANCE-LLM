# PortIQ website settings: paste the filled-in copy into Streamlit Community Cloud
# (your app → ⋮ → Settings → Secrets). Never commit the filled-in copy (.gitignore covers secrets.toml).
# Every line here is read as an environment variable (app.py copies top-level values in first).

PORTIQ_MODE = "hosted"                         # Google sign-in, one private folder per user, no brokers
PORTIQ_DATA_DIR = "~/portiq-data"              # wiped when the app restarts; restored from the database
PORTIQ_HOST_NAME = "Streamlit Community Cloud" # named in the privacy notice

# Vector store: downloaded once per start from a PRIVATE Hugging Face dataset (scripts/publish_store.py)
PORTIQ_STORE_REPO = "<hf-user>/portiq-store"
HF_TOKEN = "hf_..."                            # a READ-only token

# Answers: an OpenAI-compatible server (Groq). Questions, the passages found and asked-about holdings go there.
PORTIQ_LLM_URL = "https://api.groq.com/openai/v1"
PORTIQ_LLM_MODEL = "<model id from console.groq.com>"
PORTIQ_LLM_API_KEY = "gsk_..."
PORTIQ_ALLOW_REMOTE_LLM = "1"

# Users' portfolios survive restarts: an encrypted copy in Postgres (Neon)
PORTIQ_DATABASE_URL = "postgresql://<user>:<password>@<host>.neon.tech/neondb?sslmode=require"
PORTIQ_DATA_KEY = "<Fernet key: python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'>"
PORTIQ_STORE_NAME = "Neon"

# Daily question limits: Groq's free tier allows ~200k tokens/day per model, ~3.5k per question
PORTIQ_DAILY_QUESTIONS = "10"                  # per user
PORTIQ_DAILY_QUESTIONS_TOTAL = "50"            # whole site

[auth]
redirect_uri = "https://<your-app>.streamlit.app/oauth2callback"
cookie_secret = "<random: python -c 'import secrets; print(secrets.token_urlsafe(32))'>"
client_id = "<...>.apps.googleusercontent.com"
client_secret = "<...>"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
